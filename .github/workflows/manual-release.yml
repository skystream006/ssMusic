name: Manual Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: ./gradlew test assembleDebug

      - name: Read built APK version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())
          apk, = metadata["elements"]
          print(f"version_code={apk['versionCode']}")
          print(f"version_name={apk['versionName']}")
          PY

      - name: Rename APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "ssMusic-v${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ssMusic-v${{ steps.version.outputs.version_name }}
          path: ssMusic-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          tag="v${VERSION_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged. The rebuilt APK is available as a workflow artifact."
            exit 0
          fi
          gh release create "$tag" "ssMusic-v${VERSION_NAME}.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "ssMusic ${VERSION_NAME}" \
            --generate-notes \
            --latest
