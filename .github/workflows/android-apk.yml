name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: ./gradlew test assembleDebug

      - name: Read built APK version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())
          apk, = metadata["elements"]
          print(f"version_code={apk['versionCode']}")
          print(f"version_name={apk['versionName']}")
          PY

      - name: Set APK name
        id: apk_name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number }}"
          if [ -z "$pr_number" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              pr_number=$(gh pr list \
                --repo "${{ github.repository }}" \
                --state all \
                --search "${{ github.sha }}" \
                --json number \
                --jq '.[0].number // empty' 2>/dev/null || true)
            fi
          fi
          if [ -z "$pr_number" ]; then
            pr_number=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ -z "$pr_number" ]; then
            echo "No pull request found for ${{ github.sha }}; using 0" >&2
            pr_number=0
          fi
          echo "apk_name=ssMusic-v${{ steps.version.outputs.version_name }}-pr${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.apk_name.outputs.apk_name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk_name.outputs.apk_name }}
          path: ${{ steps.apk_name.outputs.apk_name }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_NAME: ${{ steps.apk_name.outputs.apk_name }}
        run: |
          tag="v${VERSION_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" "${APK_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "ssMusic ${VERSION_NAME}" \
            --generate-notes
