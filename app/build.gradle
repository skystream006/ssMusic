plugins {
    id 'com.android.application'
}

def gitOutput = { List<String> arguments ->
    providers.exec {
        workingDir rootDir
        commandLine(['git'] + arguments)
    }.standardOutput.asText.get().trim()
}

if (gitOutput(['rev-parse', '--is-shallow-repository']) == 'true') {
    throw new GradleException('Versioning requires full Git history. Run git fetch --unshallow.')
}

// Keep this baseline fixed: each subsequent first-parent commit advances the version.
def versionBaseline = '23d6b35ce12bad18592c85b3d6ff48f9e9ba8092'
gitOutput(['merge-base', '--is-ancestor', versionBaseline, 'HEAD'])
def versionIncrement = gitOutput(['rev-list', '--first-parent', '--count',
        "${versionBaseline}..HEAD"]).toInteger()
def appVersionCode = 36 + versionIncrement
def versionNumber = 1002 + versionIncrement
def appVersionName = String.format(java.util.Locale.ROOT, '%d.%02d.%02d',
        versionNumber.intdiv(10000), versionNumber.intdiv(100) % 100, versionNumber % 100)

android {
    namespace 'com.skystream.ssmusic'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.skystream.ssmusic"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
